name: Radiation Data API

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  proxy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Read Gist Data
        id: read
        run: |
          curl -s -H "Authorization: token ${{ secrets.GIST_TOKEN }}" \
            https://api.github.com/gists/${{ secrets.GIST_ID }} | \
            jq -r '.files["history.json"].content' > data.json
          cat data.json

      - name: Process Request
        run: |
          cat > request.json << 'EOF'
          ${{ github.event.inputs.data }}
          EOF

      - name: Update Gist
        run: |
          curl -X PATCH \
            -H "Authorization: token ${{ secrets.GIST_TOKEN }}" \
            -H "Content-Type: application/json" \
            https://api.github.com/gists/${{ secrets.GIST_ID }} \
            -d @request.json
