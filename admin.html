<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据录入 - 海水辐射值监测</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .login-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-box {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 40px;
            width: 100%;
            max-width: 450px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .login-box h2 {
            text-align: center;
            margin-bottom: 30px;
            color: #4fc3f7;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #b0bec5;
        }
        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: none;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            font-size: 1rem;
        }
        .form-group input::placeholder {
            color: #78909c;
        }
        .login-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #0288d1, #01579b);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .login-btn:hover {
            background: linear-gradient(135deg, #039be5, #0277bd);
        }
        .error-msg {
            color: #f44336;
            text-align: center;
            margin-top: 15px;
            display: none;
        }
        .back-link {
            text-align: center;
            margin-top: 20px;
        }
        .back-link a {
            color: #4fc3f7;
            text-decoration: none;
        }
        .back-link a:hover {
            text-decoration: underline;
        }
        .github-connect {
            background: rgba(79, 195, 247, 0.1);
            border: 1px solid rgba(79, 195, 247, 0.3);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
        }
        .github-connect h3 {
            color: #4fc3f7;
            margin-bottom: 10px;
            font-size: 1rem;
        }
        .github-connect p {
            color: #90a4ae;
            font-size: 0.85rem;
            margin-bottom: 10px;
        }
        .token-status {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
            padding: 10px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 5px;
        }
        .token-status.connected {
            border-left: 3px solid #4caf50;
        }
        .token-status.disconnected {
            border-left: 3px solid #f44336;
        }
        .token-status .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }
        .token-status.connected .status-dot {
            background: #4caf50;
        }
        .token-status.disconnected .status-dot {
            background: #f44336;
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <h1>🌊 海水辐射值监测平台</h1>
            <p>数据录入管理</p>
        </div>
    </header>

    <div class="login-container">
        <div class="login-box" id="login-box">
            <h2>🔐 身份验证</h2>
            
            <!-- GitHub连接 -->
            <div class="github-connect">
                <h3>🔗 GitHub 连接</h3>
                <p>输入GitHub Personal Access Token以同步数据</p>
                <div class="form-group">
                    <label for="github-token">GitHub Token</label>
                    <input type="password" id="github-token" placeholder="ghp_xxxxxxxxxxxx">
                </div>
                <button class="login-btn" style="background: linear-gradient(135deg, #2ea44d, #1a7f37);" onclick="connectGitHub()">连接GitHub</button>
                <div class="token-status disconnected" id="token-status">
                    <span class="status-dot"></span>
                    <span id="token-status-text">未连接</span>
                </div>
            </div>

            <!-- 密码登录 -->
            <h3 style="color: #90a4ae; margin: 20px 0 15px; font-size: 0.9rem;">或者使用本地密码登录</h3>
            <div class="form-group">
                <label for="username">用户名</label>
                <input type="text" id="username" placeholder="请输入用户名">
            </div>
            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" placeholder="请输入密码">
            </div>
            <div class="form-group">
                <label for="captcha">验证码</label>
                <div style="display: flex; gap: 10px;">
                    <input type="text" id="captcha" placeholder="请输入验证码" style="flex: 1;">
                    <canvas id="captcha-canvas" width="100" height="45" style="border-radius: 8px; cursor: pointer;" title="点击刷新验证码"></canvas>
                </div>
            </div>
            <button class="login-btn" onclick="verifyLogin()">登录</button>
            <div class="error-msg" id="error-msg">用户名、密码或验证码错误</div>
            <div class="back-link">
                <a href="index.html">← 返回首页</a>
            </div>
        </div>

        <div class="login-box" id="entry-box" style="display: none;">
            <h2>📝 录入数据</h2>
            <div class="form-group">
                <label for="measure-time">测量时间</label>
                <input type="datetime-local" id="measure-time">
            </div>
            <div class="form-group">
                <label for="value-uSv">辐射值 (μSv/h)</label>
                <input type="number" id="value-uSv" step="0.001" placeholder="微西弗">
            </div>
            <div class="form-group">
                <label for="value-cpm">辐射值 (CPM)</label>
                <input type="number" id="value-cpm" step="0.01" placeholder="计数每分钟">
            </div>
            <button class="login-btn" onclick="submitData()">提交数据</button>
            <div class="error-msg" id="submit-msg"></div>
            <div class="back-link">
                <a href="#" onclick="logout()">退出登录</a>
            </div>
        </div>
    </div>

    <footer>
        <div class="container">
            <p>© 2026 Seawater Radiation Monitor</p>
        </div>
    </footer>

    <script src="js/api.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
