<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据录入 - 海水辐射值监测</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .login-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-box {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 40px;
            width: 100%;
            max-width: 450px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .login-box h2 {
            text-align: center;
            margin-bottom: 30px;
            color: #4fc3f7;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #b0bec5;
        }
        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: none;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            font-size: 1rem;
        }
        .form-group input::placeholder {
            color: #78909c;
        }
        .login-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #2ea44d, #1a7f37);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .login-btn:hover {
            background: linear-gradient(135deg, #3fb950, #238636);
        }
        .error-msg {
            color: #f44336;
            text-align: center;
            margin-top: 15px;
            display: none;
        }
        .back-link {
            text-align: center;
            margin-top: 20px;
        }
        .back-link a {
            color: #4fc3f7;
            text-decoration: none;
        }
        .back-link a:hover {
            text-decoration: underline;
        }
        .github-connect {
            background: rgba(79, 195, 247, 0.1);
            border: 1px solid rgba(79, 195, 247, 0.3);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
        }
        .github-connect h3 {
            color: #4fc3f7;
            margin-bottom: 10px;
            font-size: 1rem;
        }
        .github-connect p {
            color: #90a4ae;
            font-size: 0.85rem;
            margin-bottom: 10px;
        }
        .token-status {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
            padding: 10px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 5px;
        }
        .token-status.connected {
            border-left: 3px solid #4caf50;
        }
        .token-status.disconnected {
            border-left: 3px solid #f44336;
        }
        .token-status .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }
        .token-status.connected .status-dot {
            background: #4caf50;
        }
        .token-status.disconnected .status-dot {
            background: #f44336;
        }
        .security-notice {
            background: rgba(255, 152, 0, 0.1);
            border: 1px solid rgba(255, 152, 0, 0.3);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            font-size: 0.85rem;
            color: #ff9800;
        }
        .security-notice h4 {
            margin-bottom: 8px;
            color: #ff9800;
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <h1>🌊 海水辐射值监测平台</h1>
            <p>数据录入管理</p>
        </div>
    </header>

    <div class="login-container">
        <div class="login-box" id="login-box">
            <h2>🔐 GitHub 认证</h2>
            
            <!-- 安全提示 -->
            <div class="security-notice">
                <h4>🔒 安全说明</h4>
                <p>• GitHub Token 仅存储在浏览器会话中，关闭标签页后自动清除</p>
                <p>• 请勿在公共电脑上保存登录状态</p>
                <p>• Token 仅用于访问 GitHub Gist，无其他权限</p>
            </div>

            <!-- GitHub连接 -->
            <div class="github-connect">
                <h3>🔗 GitHub Token 登录</h3>
                <p>输入GitHub Personal Access Token以同步数据到云端</p>
                <div class="form-group">
                    <label for="github-token">GitHub Token</label>
                    <input type="password" id="github-token" placeholder="ghp_xxxxxxxxxxxx">
                </div>
                <button class="login-btn" onclick="connectGitHub()">连接GitHub</button>
                <div class="token-status disconnected" id="token-status">
                    <span class="status-dot"></span>
                    <span id="token-status-text">未连接</span>
                </div>
            </div>
            
            <div class="back-link">
                <a href="index.html">← 返回首页</a>
            </div>
        </div>

        <div class="login-box" id="entry-box" style="display: none;">
            <h2>📝 录入数据</h2>
            <div class="form-group">
                <label for="measure-time">测量时间</label>
                <input type="datetime-local" id="measure-time">
            </div>
            <div class="form-group">
                <label for="value-uSv">辐射值 (μSv/h)</label>
                <input type="number" id="value-uSv" step="0.001" placeholder="微西弗">
            </div>
            <div class="form-group">
                <label for="value-cpm">辐射值 (CPM)</label>
                <input type="number" id="value-cpm" step="0.01" placeholder="计数每分钟">
            </div>
            <button class="login-btn" onclick="submitData()">提交数据</button>
            <div class="error-msg" id="submit-msg"></div>
            <div class="back-link">
                <a href="#" onclick="logout()">退出登录</a>
            </div>
        </div>
    </div>

    <footer>
        <div class="container">
            <p>© 2026 Seawater Radiation Monitor</p>
        </div>
    </footer>

    <script src="js/api.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
